<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with iOS squircle effect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Ring glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  
  <!-- Modern Wallet / Finance Icon -->
  <g filter="url(#shadow)">
    <!-- Main Card / Wallet Body -->
    <rect x="116" y="166" width="280" height="190" rx="28" fill="url(#goldGrad)" />
    
    <!-- Secondary overlapping Card -->
    <rect x="136" y="140" width="240" height="170" rx="24" fill="url(#cardGrad)" opacity="0.6" />

    <!-- Wallet Clasp -->
    <rect x="290" y="226" width="106" height="70" rx="18" fill="#1e293b" />
    <circle cx="360" cy="261" r="12" fill="#34d399" />

    <!-- Currency Symbol VND / Dollar Glow -->
    <text x="210" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle">₫</text>
  </g>
</svg>
